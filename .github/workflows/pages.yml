name: Tests and GitHub Pages

# Pull requests: run the tests and build the site.
# Pushes to main, the weekday schedule and manual runs: also fetch the latest
# daily market data for the app and publish the site to the gh-pages branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 22 * * 1-5"        # weekdays, after the US close: full daily refresh
    - cron: "5,35 13-21 * * 1-5"   # every 30 minutes through US market hours: intraday refresh

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch latest market data for the app
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          pip install --quiet yfinance
          python tools/fetch_live_data.py --out _live --intraday

      - name: Keep the previous data if today's fetch failed
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f _live/meta.json ]; then
            mkdir -p _live
            if git fetch --depth 1 origin gh-pages 2>/dev/null; then
              git archive FETCH_HEAD app/data/live 2>/dev/null | tar -x -C _live --strip-components=3 || true
            fi
          fi
          ls _live | head -30 || true

      - name: Assemble site
        run: python tools/build_site.py --out _site --live _live

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
