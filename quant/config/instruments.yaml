# Seed instrument catalogue. Index-universe equities are loaded by quant.universe (constituents), so only a
# few reference equities appear here. Every entry resolves to a trading calendar through `market`.
#   price_scale 0.01  -> vendor quotes in GBX (pence); after scaling, prices are in `currency` (GBP).
#   tradable false    -> analysis-only series (indices, yields, continuous futures).
#   stamp_duty_class  -> drives UK/Irish transaction taxes; `unknown` is taxed conservatively.
